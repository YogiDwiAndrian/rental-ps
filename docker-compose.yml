version: '3.8'
services:
  postgres:
    image: postgres:latest
    container_name: rental-ps-db
    environment:
      POSTGRES_DB: rental_ps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rental-ps-network

  redis:
    image: redis:latest
    container_name: rental-ps-redis
    ports:
      - "6379:6379"
    networks:
      - rental-ps-network

volumes:
  postgres_data:

networks:
  rental-ps-network:
    driver: bridge